services:
  - type: web
    name: nutritrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: strict
      - key: PUBLIC_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: RATE_LIMIT_STORAGE_URI
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "30"
      - key: OLLAMA_MAX_RETRIES
        value: "2"
      - key: CHROMA_PERSIST_DIR
        value: /data/chroma
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: PDF_MAX_PAGES
        value: "6"
      - key: PDF_OCR_MAX_PAGES
        value: "2"
      - key: PDF_EXTRACTION_TIMEOUT_SECONDS
        value: "20"
      - key: PDF_MAX_PAGE_DIMENSION_POINTS
        value: "2880"
      - key: PDF_MAX_RENDER_PIXELS
        value: "8000000"
      - key: PDF_OCR_SCALE
        value: "1.5"
